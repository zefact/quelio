[package]
name = "quelio"
version = "0.3.1"
description = "Quelio - MySQL / PostgreSQL クライアント"
authors = ["ZEFACT Co., Ltd."]
license = "MIT"
repository = "https://github.com/zefact/quelio"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quelio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "chrono", "rust_decimal", "uuid", "json"] }
russh = "0.62.5"
uuid = { version = "1.24.0", features = ["v4"] }
chrono = "0.4.45"
rust_decimal = "1.42.1"
base64 = "0.22"
tauri-plugin-dialog = "2.7.2"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

