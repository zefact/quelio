[package]
name = "quelio"
version = "0.7.2"
description = "Quelio - MySQL / PostgreSQL / SQLite / Valkey 対応のデスクトップDBクライアント"
authors = ["ZEFACT Co., Ltd."]
license = "MIT"
repository = "https://github.com/zefact/quelio"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quelio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# パスワードを持つ構造体を捨てるときにメモリを潰すため
zeroize = { version = "1", features = ["alloc"] }
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "rust_decimal", "uuid", "json"] }
# 結果セットを1ページ分だけストリームで読み取るために使う (sqlxが返すStreamの操作用)
futures-util = "0.3"
russh = "0.62.5"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "keep-alive"] }
# Valkey TLS (AWS ElastiCache等のin-transit暗号化) 用。
# redisクレートのTLSはinsecure時にSNIを送らずAWSに接続を切られるため、
# 自前でハンドシェイクしてSSHトンネル経由でも本来のホスト名でSNI/証明書検証を行う
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
uuid = { version = "1.24.0", features = ["v4"] }
chrono = "0.4.45"
rust_decimal = "1.42.1"
base64 = "0.22"
tauri-plugin-dialog = "2.7.2"
aes-gcm = "0.10"
# OSのキーチェーンに保存時暗号化の鍵を置く。
# 対応環境は macOS / Windows のみなので、Linuxのバックエンドは入れていない
# (Linuxで動かすと鍵が設定フォルダに平文で置かれ、暗号化の意味が薄くなる)
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
csv = "1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
# テーブル定義書のExcel出力 (純Rust。Cのライブラリを持ち込まない)
rust_xlsxwriter = "0.95"

# 外部CLI (SSM / Cloud SQL Proxy) をプロセスグループごと終わらせるため
[target.'cfg(unix)'.dependencies]
libc = "0.2"

